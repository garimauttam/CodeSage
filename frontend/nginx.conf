server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed assets if available (gzip_static module)
    gzip_static on;

    # ── SPA routing ──────────────────────────────────────────────────────────
    # React Router handles client-side navigation. All URLs (/chat, /review)
    # are just React routes — they don't correspond to real files on disk.
    # Without `try_files`, nginx returns 404 for any URL that isn't index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Asset caching ─────────────────────────────────────────────────────────
    # Vite appends a content hash to asset filenames (e.g. index-Bx7tQp1m.js).
    # Content-addressed files can be cached forever — if the file changes,
    # the hash changes, so there's no stale-cache problem.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── Health check for container orchestrators ─────────────────────────────
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
