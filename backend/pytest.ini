[pytest]
# Run all tests in the tests/ directory
testpaths = tests

# asyncio_mode = auto means you don't need @pytest.mark.asyncio on every async test
asyncio_mode = auto

# Show short tracebacks for cleaner output
addopts = -v --tb=short

# Silence noisy deprecation warnings from LangChain/Pydantic internals
filterwarnings =
    ignore::DeprecationWarning:langchain
    ignore::DeprecationWarning:pydantic
