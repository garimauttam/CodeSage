name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR to save runner minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: pytest ──────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          # CI secrets — provide dummy values so Pydantic settings validation passes.
          # Tests mock all real external calls (LLM, ChromaDB) so these are never used.
          LLM_PROVIDER: openai
          OPENAI_API_KEY: sk-ci-placeholder
          GEMINI_API_KEY: ci-placeholder
        run: python -m pytest -v --tb=short

  # ── Backend: RAG eval (self-benchmark) ──────────────────────────────────────
  # Runs the 42-query benchmark against the backend source as the corpus.
  # Fails the CI if Hit Rate drops below 40% (regression guard).
  rag-eval:
    name: RAG Benchmark (self-eval)
    runs-on: ubuntu-latest
    # Run only on push to main to keep PR checks fast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run RAG benchmark
        env:
          LLM_PROVIDER: openai
          OPENAI_API_KEY: sk-ci-placeholder
          GEMINI_API_KEY: ci-placeholder
        run: |
          python eval_rag.py --quiet --json-out eval_results.json
          echo "=== Benchmark Results ==="
          cat eval_results.json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          m = d['metrics']
          print(f\"Hit Rate @ 5:  {m['hit_rate_at_k']}%\")
          print(f\"MRR:           {m['mean_reciprocal_rank_mrr']}\")
          print(f\"Symbol Recall: {m['symbol_recall_pct']}%\")
          print(f\"Avg Latency:   {m['avg_latency_ms']} ms/query\")
          hr = m['hit_rate_at_k']
          if hr < 40:
              print(f'FAIL: Hit Rate {hr}% is below the 40% regression threshold.')
              sys.exit(1)
          print(f'PASS: Hit Rate {hr}% meets the 40% threshold.')
          "

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-benchmark-results
          path: eval_results.json
          retention-days: 30

  # ── Frontend: TypeScript type-check ─────────────────────────────────────────
  frontend-typecheck:
    name: Frontend TypeScript
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit
