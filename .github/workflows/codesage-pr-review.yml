name: CodeSage Automated PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract PR Diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...origin/${{ github.head_ref }} > pr_diff.patch
          echo "diff_size=$(wc -c < pr_diff.patch)" >> $GITHUB_OUTPUT

      - name: Trigger CodeSage Agent Review
        id: codesage
        env:
          CODESAGE_BACKEND_URL: ${{ secrets.CODESAGE_BACKEND_URL }}
          WEBHOOK_SECRET: ${{ secrets.CODESAGE_WEBHOOK_SECRET }}
        run: |
          DIFF_CONTENT=$(cat pr_diff.patch | head -c 40000)
          
          RESPONSE=$(curl -s -X POST "${CODESAGE_BACKEND_URL}/api/v1/review/pr-webhook" \
            -H "Content-Type: application/json" \
            -H "X-CodeSage-Token: ${WEBHOOK_SECRET}" \
            -d "$(jq -n \
              --arg repo "${{ github.repository }}" \
              --arg pr "${{ github.event.pull_request.number }}" \
              --arg diff "$DIFF_CONTENT" \
              --arg title "${{ github.event.pull_request.title }}" \
              '{repo: $repo, pr_number: ($pr|tonumber), title: $title, diff: $diff}')")
          
          echo "REVIEW_BODY<<EOF" >> $GITHUB_ENV
          echo "$RESPONSE" | jq -r '.review // "Review generation completed."' >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post PR Review Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const review = process.env.REVIEW_BODY;
            const commentBody = `### 🧙‍♂️ CodeSage AI Pull Request Review\n\n${review}\n\n---\n*Automated review by [CodeSage Agent](https://github.com/${context.repo.owner}/${context.repo.repo})*`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
